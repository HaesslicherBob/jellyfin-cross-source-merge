overview: "Merges movies and series from several source folders into one library tree."
description: >
  Merges movies and series from several source folders into one library.
  Only source and target directories are configured. The plugin reads the
  sources, groups them by TMDB id, title and year, and creates one folder per
  title holding one link per source. Missing sources stay visible as a shadow
  library. No python, no helper script, no schedule unless you set one.
