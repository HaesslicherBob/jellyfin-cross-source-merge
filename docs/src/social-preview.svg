<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d15"/><stop offset="0.5" stop-color="#0d1421"/><stop offset="1" stop-color="#131b2b"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.1" cy="0.0" r="0.8">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.28"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="1.0" cy="1.0" r="0.7">
      <stop offset="0" stop-color="#35c4a0" stop-opacity="0.18"/><stop offset="1" stop-color="#35c4a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#g1)"/>
  <rect width="1280" height="640" fill="url(#g2)"/>

  <g font-family="Inter">
    <rect x="96" y="96" width="212" height="32" rx="16" fill="#7c5cff" fill-opacity="0.16" stroke="#7c5cff" stroke-opacity="0.4"/>
    <circle cx="116" cy="112" r="4" fill="#a99cff"/>
    <text x="130" y="117" font-size="13.5" font-weight="600" fill="#c3baff" letter-spacing="0.4">Jellyfin 12.4 · alpha 0.0.1</text>

    <text x="92" y="232" font-size="74" font-weight="700" fill="#f6f8fb" letter-spacing="-2">Cross-Source</text>
    <text x="92" y="312" font-size="74" font-weight="700" fill="#f6f8fb" letter-spacing="-2">Merge</text>

    <text x="96" y="372" font-size="22" fill="#a9b3c4">One entry per title, however many folders.</text>
    <text x="96" y="404" font-size="22" fill="#8e99ad">Every source stays a version you can pick —</text>
    <text x="96" y="436" font-size="22" fill="#8e99ad">even while its mount is gone.</text>

    <g font-size="15" font-weight="600">
      <rect x="96" y="478" width="118" height="34" rx="17" fill="#35c4a0" fill-opacity="0.14" stroke="#35c4a0" stroke-opacity="0.45"/>
      <circle cx="118" cy="495" r="4.2" fill="#35c4a0"/>
      <text x="132" y="500" fill="#7fe0c4">1 Local</text>

      <rect x="226" y="478" width="132" height="34" rx="17" fill="#7c5cff" fill-opacity="0.16" stroke="#7c5cff" stroke-opacity="0.5"/>
      <circle cx="248" cy="495" r="4.2" fill="#a99cff"/>
      <text x="262" y="500" fill="#bdb2ff">2 Stream</text>

      <rect x="370" y="478" width="114" height="34" rx="17" fill="#f0a54a" fill-opacity="0.13" stroke="#f0a54a" stroke-opacity="0.42"/>
      <circle cx="392" cy="495" r="4.2" fill="#f0a54a"/>
      <text x="406" y="500" fill="#f3c286">3 NAS</text>
    </g>

    <text x="96" y="582" font-family="JetBrains Mono" font-size="14" fill="#5b6679">github.com/HaesslicherBob/jellyfin-cross-source-merge</text>
  </g>

  <!-- rechts: Zielordner-Auszug -->
  <g font-family="JetBrains Mono" font-size="13.5">
    <rect x="742" y="140" width="462" height="342" rx="18" fill="#0d1522" fill-opacity="0.9" stroke="#263044" stroke-width="1.3"/>
    <rect x="742" y="140" width="462" height="342" rx="18" fill="none" stroke="#7c5cff" stroke-opacity="0.15" stroke-width="1.3"/>

    <text x="772" y="186" fill="#8b97ad">/merged/TV Shows/</text>
    <text x="772" y="212" fill="#eef1f7">└ Northern Light (2024)</text>
    <text x="788" y="238" fill="#8b97ad">[tmdbid-118742]</text>
    <text x="788" y="264" fill="#8b97ad">Season 01/</text>

    <line x1="772" y1="288" x2="1174" y2="288" stroke="#202a3a"/>

    <text x="772" y="322" fill="#c9d3e2">… - S01E01 - 1 Local.mkv</text>
    <text x="772" y="348" fill="#c9d3e2">… - S01E01 - 2 Stream.mkv</text>
    <text x="772" y="374" fill="#c9d3e2">… - S01E01 - 3 NAS.mkv</text>

    <line x1="772" y1="400" x2="1174" y2="400" stroke="#202a3a"/>
    <text x="772" y="436" font-family="Inter" font-size="13" fill="#6f7a8f">one entry · three versions · no copies on disk</text>
  </g>
</svg>
